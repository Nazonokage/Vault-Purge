[project]
name = "image-dedup"
version = "1.0.0"
description = "Local image duplicate and blur review with reversible moves"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1", "rich>=13,<15", "pillow>=11,<13",
  "ImageHash>=4.3,<5", "numpy>=2,<3", "sqlmodel>=0.0.22,<0.1",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
image-dedup = "image_dedup.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image_dedup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
